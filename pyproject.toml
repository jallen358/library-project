[project]
name = "library-project"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "jallen358", email = "jallen358@gatech.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "datetime>=6.0",
    "fastapi[standard]>=0.158.2",
    "sqlalchemy>=2.1.6",
    "sqlmodel>=0.0.48",
]

[project.scripts]
library-project = "library_project:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "library-project",
]
